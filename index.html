<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This is just me practising my promise, async await skills and API">
    <meta name="keywords" content="Pokemon API | API | pokemon">
    <meta name="author" content="Kelvin Mark">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="styleOne.css">
    <link rel="stylesheet" href="styleTwo.css">
    <script src="script.js" defer></script>
    <title>Pokemon API</title>
</head>

<body>
    <header>

    </header>
    <main>
        <div class="container">
            <div class="boxOne">
                <div class="boxOneTop">
                    <div class="whiteNBlueCircleCon">
                        <div class="whiteCircle">
                            <div class="blueCircle"></div>
                        </div>
                    </div>
                    <div class="smallCirclesCon">
                        <div class="smallRedCircle"></div>
                        <div class="smallGreenCircle"></div>
                        <div class="smallYellowCircle"></div>
                    </div>
                </div>
                <div class="screenCon">
                    <div class="bigScreen">
                        <div class="smallScreen">Enter a Pokémon name in the search bar and click on the search
                            icon to see a pic of it.<br><br>Don't know any Pokémon? click on "Generate a random Pokémon
                            name".
                        </div>
                    </div>
                </div>

                <div class="buttonsCon">
                    <div class="blueBtn"></div>
                    <div class="selectBtn"></div>
                    <div class="startBtn"></div>
                    <div class="directionBtnCon">
                        <div class="verticalDirection"></div>
                        <div class="horizontalDirection"></div>
                    </div>
                </div>
                <div class="yellowRectangle"></div>
            </div>
            <div class="hinge"></div>
            <div class="boxTwo">
                <div class="boxTwoTop">
                    <div class="whiteNBlueCircleConBox2"></div>
                    <div class="smallCirclesConBox2"></div>
                </div>
                <div class="inputDiv">
                    <input type="text" name="" id="" class="input" placeholder="Enter a pokemon name">
                    <button class="btn material-icons">search
                    </button>
                </div>
                <div class="gridDiv">
                    <div class="grid"></div>
                    <div class="grid"></div>
                    <div class="grid"></div>
                    <div class="grid"></div>
                    <div class="grid"></div>
                    <div class="grid"></div>
                    <div class="grid"></div>
                    <div class="grid"></div>
                </div>
                <div class="pokemonNameGenerator">
                    <p> click to Generate a random pokemon name</p>
                </div>
                <div class="boxesNButton">
                    <div class="greyBox"></div>
                    <div class="greyBox2"></div>
                    <div class="goldCircle"></div>
                </div>
                <div class="duoRectangle">
                    <div class="rect"></div>
                    <div class="rect2"></div>
                </div>

            </div>

        </div>
        <div>
            <p class="favPoke">My favorite Pokémon is <i>Wooper</i> by the way... but I also like <i>Geodude</i>,<i>Mewtwo</i> and <i>Silicobra</i></p>
        </div>
    </main>
    <footer>

    </footer>
</body>


</html>
